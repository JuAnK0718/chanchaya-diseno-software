# Nombre de la aplicacion
spring.application.name=canchaya

# Puerto del backend
server.port=8080

# --- MongoDB (Atlas) ---
# Definir la variable de entorno MONGODB_URI antes de ejecutar:
#   $env:MONGODB_URI = "mongodb+srv://admin:<password>@cluster0.3eyvhdk.mongodb.net/canchaya_db?retryWrites=true&w=majority&appName=Cluster0"
# O crear un archivo .env (ignorado por git) con esa variable y cargarlo con:
#   Get-Content .env | ForEach-Object { $k,$v = $_ -split '=',2; [System.Environment]::SetEnvironmentVariable($k,$v) }
spring.data.mongodb.uri=${MONGODB_URI}
