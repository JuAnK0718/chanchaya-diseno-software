# Nombre de la aplicacion
spring.application.name=canchaya

# Puerto del backend
server.port=8080

# --- MongoDB ---
# La URI real (Atlas) se define fuera del control de versiones:
#   - archivo ./config/application.properties (cargado automaticamente por Spring Boot, ignorado por git), o
#   - variable de entorno MONGODB_URI.
# Si no se define ninguna, usa MongoDB local por defecto.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/canchaya_db}
